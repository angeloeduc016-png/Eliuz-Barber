<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="eliuz-api-base" content="">
  <meta name="description" content="Gerencie os produtos exibidos para os clientes da Eliuz Barber.">
  <link rel="icon" href="../images/favicon.ico" type="image/x-icon">
  <title>Produtos | Eliuz Barber</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="admin-site">
  <header class="site-header">
    <div class="container nav-shell">
      <a class="brand" href="agendamentos.html"><span class="brand-mark"><img src="../images/logo.png" alt="Eliuz Barber" class="brand-logo"></span></a>
      <button class="header-theme" type="button" data-theme-toggle aria-label="Usar tema do dispositivo" title="Tema do dispositivo">◐</button>
      <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="professional-navigation" aria-label="Abrir menu"><span></span><span></span><span></span></button>
      <nav class="site-nav professional-nav" id="professional-navigation">
        <a href="agendamentos.html">Agenda</a>
        <a href="clientes.html">Clientes</a>
        <a href="finance.html">Financeiro</a>
        <a aria-current="page" href="produtos.html">Produtos</a>
        <a href="galeria.html">Galeria</a>
      </nav>
      <div id="admin-controls" class="admin-toolbar"></div>
    </div>
  </header>

  <main class="section-pad">
    <div class="container">
      <div class="section-heading reveal is-visible">
        <span class="eyebrow">Catálogo</span>
        <h1>Produtos.</h1>
        <p>Atualizações feitas aqui aparecem na página de produtos dos clientes.</p>
      </div>

      <div class="products-workspace">
        <section class="finance-card products-form-panel reveal is-visible">
          <div class="panel-heading">
            <span class="eyebrow">Cadastro</span>
            <h2 id="product-form-heading">Novo produto</h2>
          </div>
          <form id="product-form" class="simple-form product-form">
            <input type="hidden" id="product-id">
            <label>Nome
              <input id="product-name" type="text" required placeholder="Nome do produto">
            </label>
            <label>Descrição curta
              <input id="product-short" type="text" required placeholder="Descrição objetiva">
            </label>
            <label>Descrição completa
              <textarea id="product-description" rows="3" placeholder="Detalhes do produto"></textarea>
            </label>
            <div class="product-form-row">
              <label>Valor (R$)
                <input id="product-price" type="number" min="0" step="0.01" required placeholder="0,00">
              </label>
              <label>Quantidade
                <input id="product-quantity" type="number" min="0" step="1" placeholder="Opcional para itens antigos">
              </label>
            </div>
            <label>Imagem
              <input id="product-image" type="file" accept="image/*">
            </label>
            <figure id="product-image-preview-wrap" class="image-upload-preview" hidden>
              <img id="product-image-preview" alt="Prévia da imagem do produto">
            </figure>
            <label>Categoria
              <input id="product-category" type="text" placeholder="Cabelo, barba, kit...">
            </label>
            <div class="toolbar product-form-actions">
              <button class="btn btn-primary" type="submit">Salvar produto</button>
              <button id="product-clear" class="btn btn-secondary" type="button">Limpar</button>
            </div>
            <p id="product-feedback" class="form-feedback" role="status" aria-live="polite"></p>
          </form>
        </section>

        <section class="booking-card products-list-panel reveal is-visible">
          <div class="toolbar toolbar-between panel-heading">
            <div>
              <span class="eyebrow">Visível para clientes</span>
              <h2>Catálogo</h2>
            </div>
            <strong id="product-count" class="product-count">0 produtos</strong>
          </div>
          <div id="product-list" class="product-list product-admin-list" aria-live="polite"></div>
        </section>
      </div>
    </div>
  </main>

  <script>
    if (!sessionStorage.getItem('ADMIN_TOKEN')) location.href = '../login.html';
  </script>
  <script src="../js/storage.js" defer></script>
  <script src="../js/main.js" defer></script>
  <script src="../js/image-upload.js" defer></script>
  <script src="../js/produtos.js" defer></script>
</body>
</html>
